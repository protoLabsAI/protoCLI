name: 'Release'

# Fires when a release-bearing PR is merged into main.
# Builds the bundle, publishes @protolabsai/proto to npm, tags, and creates a GitHub Release.
#
# Two flows trigger this:
#   1. Auto-release: auto-release.yml opens an `auto-release/v*` PR with the
#      version bump, which merges to main and triggers this workflow.
#   2. Manual dev→main promotion: dev branch PR'd into main (legacy path,
#      still supported).

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

permissions: read-all

jobs:
  release:
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'protoLabsAI/protoCLI' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.pull_request.merged == true &&
          (
            github.event.pull_request.head.ref == 'dev' ||
            startsWith(github.event.pull_request.head.ref, 'auto-release/')
          )
        )
      )
    timeout-minutes: 30
    permissions:
      contents: write
      # OIDC trusted publishing to npm — lets `npm publish` mint a
      # short-lived identity token instead of using a long-lived NPM_TOKEN.
      # Works even with the package's "require 2FA / disallow tokens" setting.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          # NOTE: deliberately no `registry-url`. setup-node's registry-url
          # writes a temp .npmrc with `_authToken=${NODE_AUTH_TOKEN}` +
          # always-auth=true and injects a placeholder NODE_AUTH_TOKEN, which
          # shadows OIDC trusted publishing (npm sees a token and skips the
          # OIDC exchange → ENEEDAUTH/404). The committed root .npmrc already
          # sets `registry=https://registry.npmjs.org`, so the registry is
          # configured without the auth placeholder. See #245/#247.

      - name: Install dependencies
        run: npm ci

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: v${VERSION}"

          if git tag -l "v${VERSION}" | grep -q "v${VERSION}"; then
            echo "already_tagged=true" >> "$GITHUB_OUTPUT"
            echo "WARNING: v${VERSION} is already tagged — skipping."
          else
            echo "already_tagged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build bundle
        if: steps.version.outputs.already_tagged != 'true'
        run: npm run bundle

      - name: Prepare package
        if: steps.version.outputs.already_tagged != 'true'
        run: npm run prepare:package

      - name: Publish to npm (OIDC trusted publisher)
        if: steps.version.outputs.already_tagged != 'true'
        working-directory: dist
        # OIDC trusted publishing requires npm >= 11.5.1; the Node pinned in
        # .nvmrc ships an older npm, so upgrade in-step before publishing.
        # No NODE_AUTH_TOKEN — the id-token:write permission above lets npm
        # exchange the GitHub OIDC token for a registry credential, and a
        # stale/empty token env would shadow that exchange. --provenance
        # emits a signed provenance attestation (also OIDC-backed).
        run: |
          npm install -g npm@latest
          npm --version
          npm publish --access public --provenance

      - name: Configure git
        if: steps.version.outputs.already_tagged != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create tag
        if: steps.version.outputs.already_tagged != 'true'
        run: |
          git tag -a "${{ steps.version.outputs.tag }}" -m "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.version.outputs.already_tagged != 'true'
        run: |
          VERSION="${{ steps.version.outputs.tag }}"

          RAW_NOTES=$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$VERSION" --jq '.body')

          # Filter out chore PRs unless they're all there is
          ALL_LINES=$(echo "$RAW_NOTES" | grep '^\* ' || true)
          NON_CHORE=$(echo "$ALL_LINES" | grep -vi '^\* chore' || true)

          if [ -n "$NON_CHORE" ]; then
            NOTES=$(echo "$RAW_NOTES" | grep -vi '^\* chore')
          else
            NOTES="$RAW_NOTES"
          fi

          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "$NOTES"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute previous tag
        if: steps.version.outputs.already_tagged != 'true'
        id: prev_tag
        run: |
          PREV_TAG=$(git tag --sort=-v:refname \
            | grep -v "^${{ steps.version.outputs.tag }}$" | head -1)
          echo "tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          echo "Diffing $PREV_TAG → ${{ steps.version.outputs.tag }}"

      - name: Rewrite notes and post to Discord
        id: notes
        if: steps.version.outputs.already_tagged != 'true'
        continue-on-error: true
        uses: protoLabsAI/release-tools@v0.1.3
        with:
          version: ${{ steps.version.outputs.tag }}
          previous-version: ${{ steps.prev_tag.outputs.tag }}
        env:
          GATEWAY_API_KEY: ${{ secrets.GATEWAY_API_KEY }}
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}

      # If the rewrite/post step failed (e.g. transient gateway 502, expired
      # key), fire a plain webhook warning so the team notices — but do NOT
      # block the release. The release itself is already published; the
      # release-notes pipeline is a nice-to-have on top.
      - name: Warn on Discord notes failure
        if: steps.notes.outcome == 'failure'
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          VERSION: ${{ steps.version.outputs.tag }}
          PREV: ${{ steps.prev_tag.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::DISCORD_RELEASE_WEBHOOK not set; skipping warning post."
            exit 0
          fi
          MSG=":warning: **Release notes pipeline failed** for \`$VERSION\` (prev \`$PREV\`). The release itself is published; only the AI-rewritten notes did not post. Run: $RUN_URL"
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "$(jq -n --arg c "$MSG" '{content: $c}')" \
            "$WEBHOOK" || echo "::warning::Webhook post also failed."

      - name: Sync main back to dev
        id: sync_dev
        if: steps.version.outputs.already_tagged != 'true'
        continue-on-error: true
        run: |
          # After tagging on main, merge back to dev so the branches stay aligned.
          git fetch origin dev
          git checkout dev
          git merge origin/main --no-edit -m "chore: sync main back to dev after release"
          git push origin dev

      # dev has been drifting for many releases (merge conflicts in
      # package.json / package-lock.json when dev is far behind). Surface the
      # failure instead of letting `continue-on-error` swallow it silently.
      - name: Warn on dev-sync failure
        if: steps.sync_dev.outcome == 'failure'
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          VERSION: ${{ steps.version.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::DISCORD_RELEASE_WEBHOOK not set; skipping warning post."
            exit 0
          fi
          MSG=":warning: **dev-branch sync failed** for \`$VERSION\` — likely merge conflicts vs. main. dev is drifting. Run: $RUN_URL"
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "$(jq -n --arg c "$MSG" '{content: $c}')" \
            "$WEBHOOK" || echo "::warning::Webhook post also failed."

      - name: Alert on already-tagged
        if: steps.version.outputs.already_tagged == 'true'
        run: |
          echo "::warning::${{ steps.version.outputs.tag }} is already tagged. Ensure prepare-release.yml ran on dev first."
          exit 1
