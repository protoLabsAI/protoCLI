name: 'Release'

# Fires when a release-bearing PR is merged into main.
# Builds the bundle, publishes @protolabsai/proto to npm, tags, and creates a GitHub Release.
#
# Trigger: auto-release.yml opens an `auto-release/v*` PR with the version bump,
# which merges to main and triggers this workflow. (Can also be run manually via
# workflow_dispatch.)

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

permissions: read-all

jobs:
  release:
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'protoLabsAI/protoCLI' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.pull_request.merged == true &&
          startsWith(github.event.pull_request.head.ref, 'auto-release/')
        )
      )
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: v${VERSION}"

          if git tag -l "v${VERSION}" | grep -q "v${VERSION}"; then
            echo "already_tagged=true" >> "$GITHUB_OUTPUT"
            echo "WARNING: v${VERSION} is already tagged — skipping."
          else
            echo "already_tagged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build bundle
        if: steps.version.outputs.already_tagged != 'true'
        run: npm run bundle

      - name: Prepare package
        if: steps.version.outputs.already_tagged != 'true'
        run: npm run prepare:package

      - name: Publish to npm
        if: steps.version.outputs.already_tagged != 'true'
        working-directory: dist
        # Token auth via NPM_TOKEN. Requires the package's "Publishing access"
        # to allow "2FA or a granular access token with bypass 2fa enabled"
        # (not "disallow tokens"), and NPM_TOKEN to be a granular token with
        # @protolabsai org + package write. OIDC trusted publishing was
        # attempted (#278/#280) but npm never engaged the exchange — see #255.
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Configure git
        if: steps.version.outputs.already_tagged != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create tag
        if: steps.version.outputs.already_tagged != 'true'
        run: |
          git tag -a "${{ steps.version.outputs.tag }}" -m "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.version.outputs.already_tagged != 'true'
        run: |
          VERSION="${{ steps.version.outputs.tag }}"

          RAW_NOTES=$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$VERSION" --jq '.body')

          # Filter out chore PRs unless they're all there is
          ALL_LINES=$(echo "$RAW_NOTES" | grep '^\* ' || true)
          NON_CHORE=$(echo "$ALL_LINES" | grep -vi '^\* chore' || true)

          if [ -n "$NON_CHORE" ]; then
            NOTES=$(echo "$RAW_NOTES" | grep -vi '^\* chore')
          else
            NOTES="$RAW_NOTES"
          fi

          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "$NOTES"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute previous tag
        if: steps.version.outputs.already_tagged != 'true'
        id: prev_tag
        run: |
          PREV_TAG=$(git tag --sort=-v:refname \
            | grep -v "^${{ steps.version.outputs.tag }}$" | head -1)
          echo "tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          echo "Diffing $PREV_TAG → ${{ steps.version.outputs.tag }}"

      - name: Rewrite notes and post to Discord
        id: notes
        if: steps.version.outputs.already_tagged != 'true'
        continue-on-error: true
        uses: protoLabsAI/release-tools@v2.1.1
        with:
          version: ${{ steps.version.outputs.tag }}
          previous-version: ${{ steps.prev_tag.outputs.tag }}
        env:
          GATEWAY_API_KEY: ${{ secrets.GATEWAY_API_KEY }}
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}

      # If the rewrite/post step failed (e.g. transient gateway 502, expired
      # key), fire a plain webhook warning so the team notices — but do NOT
      # block the release. The release itself is already published; the
      # release-notes pipeline is a nice-to-have on top.
      - name: Warn on Discord notes failure
        if: steps.notes.outcome == 'failure'
        env:
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          VERSION: ${{ steps.version.outputs.tag }}
          PREV: ${{ steps.prev_tag.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # The release is already published; the AI-rewritten notes are a
          # nice-to-have. Diagnose why the post failed, surface it in the run
          # summary, and never block the release (always exit 0).
          note() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }

          if [ -z "$WEBHOOK" ]; then
            note "::warning::DISCORD_RELEASE_WEBHOOK is not set — skipping Discord warning post for $VERSION."
            exit 0
          fi

          MSG=":warning: **Release notes pipeline failed** for \`$VERSION\` (prev \`$PREV\`). The release itself is published; only the AI-rewritten notes did not post. Run: $RUN_URL"
          # Capture the HTTP status so we can tell a dead webhook (regenerate the
          # secret) apart from a transient/network error (just retry the run).
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg c "$MSG" '{content: $c}')" \
            "$WEBHOOK" || echo 000)

          case "$CODE" in
            2*)
              note "Posted release-notes-failure warning to Discord for $VERSION (HTTP $CODE)." ;;
            401|403|404|410)
              note "::warning::DISCORD_RELEASE_WEBHOOK is invalid or deleted (HTTP $CODE — Discord \"Unknown Webhook\"). Regenerate the webhook in Discord and update the DISCORD_RELEASE_WEBHOOK repo secret. Release $VERSION published fine; only the Discord notification is affected." ;;
            000)
              note "::warning::Could not reach the Discord webhook (network error) when posting the $VERSION warning." ;;
            *)
              note "::warning::Discord webhook post returned HTTP $CODE for $VERSION." ;;
          esac
          exit 0

      # Keep the marketing changelog (cli.protolabs.studio/changelog) in sync from
      # the same git history release-tools uses. Pushing to main re-triggers
      # marketing-deploy.yml, which publishes the updated /changelog. Best-effort:
      # never block a release that has already published + tagged above.
      - name: Update marketing changelog
        if: steps.version.outputs.already_tagged != 'true'
        continue-on-error: true
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          PREV="${{ steps.prev_tag.outputs.tag }}"
          git checkout main
          git pull --ff-only origin main
          RELEASE_DATE="$(date -u +%Y-%m-%d)" node scripts/changelog-entry.mjs "$TAG" "$PREV"
          git add sites/marketing/data/changelog.json
          if git diff --cached --quiet; then
            echo "No marketing-changelog change for $TAG."
          else
            git commit -m "chore(changelog): $TAG"
            git push origin main
          fi

      # An already-tagged version is an expected, benign outcome — e.g. two
      # auto-release runs raced and opened duplicate bump PRs for the same
      # version (now prevented in auto-release.yml, but a merged duplicate can
      # still reach here). The publish/tag steps above are correctly skipped;
      # warn but exit 0 so the redundant run isn't a spurious red ❌.
      - name: Note already-tagged (no-op release)
        if: steps.version.outputs.already_tagged == 'true'
        run: |
          echo "::warning::${{ steps.version.outputs.tag }} is already tagged; nothing to publish. This run is a no-op (likely a duplicate release PR)."
