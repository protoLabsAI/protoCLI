name: 'Post Release to Discord'

# Manual trigger to (re)post release notes for a specific version.
# Use when the automatic Discord post was skipped (e.g. squash-merge history).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to post (e.g. v0.25.15)'
        required: true
      previous_version:
        description: 'Previous release tag (e.g. v0.25.12)'
        required: true
      dry_run:
        description: 'Dry run — print notes without posting'
        type: boolean
        default: false

permissions: read-all

jobs:
  post:
    runs-on: ubuntu-latest
    if: github.repository == 'protoLabsAI/protoCLI'
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Post release notes to Discord
        uses: protoLabsAI/release-tools@v0.1.0
        with:
          version: ${{ inputs.version }}
          previous-version: ${{ inputs.previous_version }}
          dry-run: ${{ inputs.dry_run }}
          post-discord: ${{ inputs.dry_run == false }}
        env:
          GATEWAY_API_KEY: ${{ secrets.GATEWAY_API_KEY }}
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          RELEASE_NOTES_MODEL: protolabs/smart
