name: 'Auto Release'

# Triggers after CI passes on main. Reads conventional commits since the last
# tag, determines the bump type (major/minor/patch), bumps all workspace
# versions, creates a PR with the version bump, and enables auto-merge.
# When the PR's required status checks pass, it merges automatically,
# which triggers release.yml to publish.
#
# Skips automatically if:
#   - All commits since last tag are release commits ("chore: release v*")
#   - No commits since last tag
#   - The triggering commit is itself a release commit (prevents loops)

on:
  workflow_run:
    workflows:
      - 'CI'
    types:
      - completed
    branches:
      - main

permissions: read-all

# Serialize auto-release runs. When several PRs merge in quick succession each
# CI completion triggers this workflow; without serialization they race and
# each opens a bump PR for the *same* next version (computed from the same
# last tag), producing duplicate release PRs and a spurious already-tagged
# failure in release.yml. Running one at a time lets the later run observe the
# branch/tag the earlier one created and skip. `cancel-in-progress: false` so
# an in-flight bump is never aborted half-way.
concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  auto-release:
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'protoLabsAI/protoCLI' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Determine bump type
        id: bump
        run: |
          BUMP=$(node scripts/determine-bump.js)
          echo "type=${BUMP}" >> "$GITHUB_OUTPUT"
          echo "Bump type: ${BUMP}"

      - name: Skip if nothing to release
        if: steps.bump.outputs.type == 'skip'
        run: |
          echo "No publishable commits since last tag — skipping release."

      - name: Skip if triggered by a release commit
        if: steps.bump.outputs.type != 'skip'
        id: guard
        run: |
          LAST_MSG=$(git log -1 --pretty=format:%s)
          if echo "$LAST_MSG" | grep -qE '^chore: release v'; then
            echo "Last commit is a release commit — skipping to avoid loop."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git
        if: >-
          steps.bump.outputs.type != 'skip' &&
          steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        if: >-
          steps.bump.outputs.type != 'skip' &&
          steps.guard.outputs.skip != 'true'
        run: node scripts/version.js ${{ steps.bump.outputs.type }}

      - name: Get new version
        if: >-
          steps.bump.outputs.type != 'skip' &&
          steps.guard.outputs.skip != 'true'
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Guard against a duplicate release for this version. Even with the
      # concurrency lock, a queued run computes the same next version as the
      # one that just finished; bail if that version is already tagged or a
      # release branch for it already exists.
      - name: Skip if release already in flight or tagged
        if: >-
          steps.bump.outputs.type != 'skip' &&
          steps.guard.outputs.skip != 'true'
        id: exists
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if git ls-remote --tags origin "refs/tags/v${VERSION}" | grep -q .; then
            echo "v${VERSION} is already tagged — skipping duplicate release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --heads origin "refs/heads/auto-release/v${VERSION}" | grep -q .; then
            echo "Branch auto-release/v${VERSION} already exists — a release PR is already in flight; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release PR
        if: >-
          steps.bump.outputs.type != 'skip' &&
          steps.guard.outputs.skip != 'true' &&
          steps.exists.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BRANCH="auto-release/v${VERSION}"

          # Create a branch, commit the version bump, push, and open a PR
          git checkout -b "${BRANCH}"
          git add package.json package-lock.json packages/*/package.json
          git commit -m "chore: release v${VERSION}"
          git push origin "${BRANCH}"

          PR_URL=$(gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "chore: release v${VERSION}" \
            --body "Automated version bump to v${VERSION} (${{ steps.bump.outputs.type }})." \
          )
          echo "Created PR: ${PR_URL}"

          # Enable auto-merge so it merges once required status checks pass.
          # Tolerate repos where auto-merge is disabled (allow_auto_merge=false):
          # the release PR is already open, so leave it for manual merge instead
          # of failing the whole job and paging the Actions tab red on every release.
          if gh pr merge "${PR_URL}" --auto --squash; then
            echo "Auto-merge enabled on ${PR_URL}"
          else
            echo "::warning::Could not enable auto-merge (is 'Allow auto-merge' enabled in repo settings?). Release PR ${PR_URL} is open and must be merged manually."
          fi
