name: 'SDK Release'

# Publishes @protolabsai/sdk to npm whenever a tag matching sdk-v* is pushed.
# To cut an SDK release:
#   npm version patch --workspace packages/sdk-typescript --no-git-tag-version
#   git add packages/sdk-typescript/package.json
#   git commit -m "chore(sdk): release vX.Y.Z"
#   git tag sdk-vX.Y.Z && git push origin sdk-vX.Y.Z

on:
  push:
    tags:
      - 'sdk-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip npm publish)'
        type: boolean
        default: false

permissions: read-all

jobs:
  sdk-release:
    runs-on: ubuntu-latest
    if: github.repository == 'protoLabsAI/protoCLI'
    timeout-minutes: 15
    permissions:
      # contents: write — creating the GitHub release at the end of the job.
      contents: write
      # id-token: write — npm OIDC trusted publishing. The npm CLI (≥11.5.1)
      # mints a short-lived registry token from the GitHub Actions OIDC
      # provider via the `id-token` permission, replacing the long-lived
      # NPM_PUBLISH_TOKEN secret. Configured under
      # https://www.npmjs.com/package/@protolabsai/sdk/access "Trusted
      # Publisher" pointing at this workflow file + repo.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          # No `registry-url:` on purpose. Setting it makes setup-node
          # write `.npmrc` and export `NODE_AUTH_TOKEN=XXXXX-...` as a
          # literal placeholder env var (it expects a per-step env block
          # to substitute the real token). With OIDC trusted publishing
          # there is no token, so leaving registry-url set causes npm to
          # auth with the placeholder string and get a 404 from the
          # registry before OIDC can take over. npm defaults to
          # https://registry.npmjs.org without this anyway.

      - name: Install dependencies
        run: npm ci

      - name: Get SDK version
        id: version
        run: |
          VERSION=$(node -p "require('./packages/sdk-typescript/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=sdk-v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "SDK version: $VERSION"

      - name: Build SDK
        working-directory: packages/sdk-typescript
        run: npm run build && npm run bundle:cli

      # npm CLI ≥ 11.5.1 is required for OIDC trusted publishing. The
      # bundled npm shipping with Node.js 22 is older, so install a fresh
      # one for this step.
      - name: Pin npm to OIDC-capable version
        if: ${{ !inputs.dry_run }}
        run: npm install -g npm@latest

      - name: Publish to npm (via OIDC trusted publisher)
        if: ${{ !inputs.dry_run }}
        working-directory: packages/sdk-typescript
        # No NODE_AUTH_TOKEN — npm reads the GitHub OIDC token directly
        # via the workflow's id-token: write permission and exchanges it
        # for a one-shot publish token against the registry.
        run: npm publish --access public

      - name: Dry run publish
        if: ${{ inputs.dry_run }}
        working-directory: packages/sdk-typescript
        run: npm publish --access public --dry-run

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "@protolabsai/sdk ${{ steps.version.outputs.tag }}" \
            --notes "## @protolabsai/sdk ${{ steps.version.outputs.version }}

          \`\`\`bash
          npm install @protolabsai/sdk
          \`\`\`

          See [CHANGELOG](packages/sdk-typescript/CHANGELOG.md) for details." \
            --latest=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
